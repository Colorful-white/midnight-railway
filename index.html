<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151d1a">
  <meta name="description" content="在一颗微缩星球上，乘一列每天回到零点小站的列车。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="零点环线">
  <title>零点环线</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="railway.css">
  <script defer src="launch.js"></script>
  <script defer src="app-install.js"></script>
  <script defer src="world.js" data-launch-progress="52"></script>
  <script defer src="cabin.js" data-launch-progress="70"></script>
  <script defer src="railway.js" data-launch-progress="86"></script>
</head>
<body>
  <section id="welcome" class="welcome" aria-labelledby="welcome-title">
    <div class="welcome-content">
      <svg class="welcome-planet" viewBox="0 0 320 250" aria-hidden="true">
        <defs>
          <radialGradient id="welcome-globe" cx="30%" cy="20%" r="85%"><stop stop-color="#7f9b82"/><stop offset=".55" stop-color="#3a6356"/><stop offset="1" stop-color="#1c3835"/></radialGradient>
          <clipPath id="welcome-edge"><circle cx="160" cy="122" r="85"/></clipPath>
        </defs>
        <g class="welcome-stars" fill="#ead6a5" stroke="none"><circle cx="48" cy="70" r="1.4"/><circle cx="270" cy="58" r="1"/><circle cx="265" cy="174" r="1.7"/><circle cx="61" cy="186" r="1"/><circle cx="215" cy="24" r="1"/></g>
        <ellipse cx="160" cy="224" rx="62" ry="8" fill="#050f0e" opacity=".3" stroke="none"/>
        <circle cx="160" cy="122" r="92" stroke="#d9c798" stroke-opacity=".17" stroke-width=".7"/>
        <circle cx="160" cy="122" r="85" fill="url(#welcome-globe)" stroke="#bec9a1" stroke-opacity=".48" stroke-width=".8"/>
        <g clip-path="url(#welcome-edge)" stroke="none">
          <path d="m68 124 30-25 24 15 38-40 43 39 26-8 28 24v94H67Z" fill="#66836a"/>
          <path d="m72 160 38-21 27 17 38-28 39 28 33-11 16 24v54H69Z" fill="#3b5d4c"/>
          <path d="m89 183 36-24 43 24 35-14 48 22v32H78Z" fill="#28493e"/>
          <path d="m123 114 37-40-9 50-14-13Z" fill="#a4ac85" opacity=".65"/>
          <g fill="#264b3d"><path d="m99 150 10-30 10 30h-7v10h-6v-10Z"/><path d="m198 146 12-36 12 36h-9v10h-6v-10Z"/><path d="m176 170 9-27 9 27h-6v9h-6v-9Z"/></g>
          <path d="M76 151Q159 187 243 145" stroke="#a9ac80" stroke-width="4" fill="none"/>
          <path d="M76 151Q159 187 243 145" stroke="#eee1b2" stroke-width=".85" stroke-dasharray="2 4" fill="none"/>
          <g class="welcome-train" transform="translate(140 166) rotate(3)">
            <rect x="-19" y="-9" width="13" height="8" rx="2" fill="#c2b77e"/><rect x="-3" y="-10" width="18" height="9" rx="2" fill="#e4d5a0"/>
            <rect x="0" y="-8" width="4" height="3" fill="#496456"/><rect x="6" y="-8" width="4" height="3" fill="#496456"/>
            <path d="M15-7h4v6h-4" fill="#b8965d"/><circle cx="1" cy="0" r="2" fill="#142e29"/><circle cx="13" cy="0" r="2" fill="#142e29"/><circle cx="-15" cy="0" r="2" fill="#142e29"/><circle cx="-9" cy="0" r="2" fill="#142e29"/>
            <circle class="welcome-lamp" cx="19" cy="-5" r="2" fill="#fff1bd"/>
          </g>
        </g>
      </svg>
      <h2 id="welcome-title">泉儿和果儿的开心小天地</h2>
      <div id="welcome-progress" class="welcome-progress" role="progressbar" aria-label="准备观景旅程" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="welcome-fill"></span></div>
      <p id="welcome-status" class="welcome-status" role="status"></p>
      <button id="welcome-retry" class="welcome-retry" type="button" hidden>重新打开</button>
      <noscript><p>请开启浏览器的 JavaScript，列车才能出发。</p></noscript>
    </div>
  </section>
  <main id="journey" aria-label="零点环线观景窗" aria-hidden="true" inert>
    <canvas id="world" aria-label="随本地时间行驶的微缩铁路"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="carriage" aria-hidden="true"><div></div></div>
    <header class="masthead">
      <svg id="planet" viewBox="0 0 100 100" role="img" aria-labelledby="planet-title">
        <title id="planet-title">环线星球，细线是轨道，光点是列车位置</title>
        <defs>
          <radialGradient id="planet-surface" cx="35%" cy="27%" r="70%">
            <stop stop-color="#64847b"/><stop offset=".56" stop-color="#34564f"/><stop offset="1" stop-color="#1b2c34"/>
          </radialGradient>
          <radialGradient id="planet-shade" cx="33%" cy="24%" r="82%">
            <stop offset=".32" stop-color="#101e27" stop-opacity="0"/><stop offset="1" stop-color="#101922" stop-opacity=".54"/>
          </radialGradient>
          <clipPath id="planet-edge"><circle cx="50" cy="50" r="44"/></clipPath>
        </defs>
        <circle cx="50" cy="50" r="47" stroke="#c6e1c3" stroke-opacity=".19" stroke-width=".8"/>
        <circle cx="50" cy="50" r="44" fill="url(#planet-surface)" stroke="#aac9ab" stroke-opacity=".65" stroke-width="1"/>
        <g clip-path="url(#planet-edge)">
          <path d="M3 62 15 58 18 48 26 44 29 34 37 32 40 17 53 12 59 20 56 32 62 40 60 52 67 57 74 54 83 59 91 54 98 66 88 76 74 77 67 88 52 85 46 72 37 69 33 74 23 68 12 74Z" fill="#92a47f" fill-opacity=".36" stroke="none"/>
          <path d="m24 24 7-10 12-3-6 9-8 2Zm50-4 11 2 9 10-5 9-9-4-4-8-8-5Z" fill="#a5ab8e" fill-opacity=".26" stroke="none"/>
          <path d="M9 37Q50 19 92 37M6 53Q50 34 94 53M10 70Q50 53 91 70M45 7C17 24 19 77 46 93M55 7C80 24 80 77 55 93" stroke="#d2e6bd" stroke-opacity=".21" stroke-width=".65"/>
          <circle cx="50" cy="50" r="44" fill="url(#planet-shade)" stroke="none"/>
          <path id="planet-track" stroke="#f3daa4" stroke-width=".78" stroke-opacity=".85"/>
          <g id="planet-train" visibility="hidden">
            <circle r="4.7" fill="#fcd890" fill-opacity=".26" stroke="none"/>
            <circle r="2.2" fill="#fff5c9" stroke="#edbd74" stroke-width=".65"/>
          </g>
        </g>
      </svg>
      <div><h1>零点环线</h1><span>MIDNIGHT RAILWAY</span></div>
    </header>
    <div id="chapter" class="chapter"><span id="chapter-index"></span><strong id="chapter-name"></strong></div>
    <section id="ticket" class="ticket" aria-label="列车时刻表">
      <button id="ticket-toggle" class="ticket-heading" type="button" aria-expanded="false" aria-controls="departures">
        <span><small id="ticket-label">下一站</small><strong id="ticket-name"></strong></span>
        <span><time id="ticket-time"></time><small id="ticket-countdown"></small></span>
      </button>
      <ol id="departures" hidden></ol>
    </section>
    <button id="menu-toggle" class="menu-toggle" type="button" aria-label="功能菜单" aria-expanded="false" aria-controls="feature-menu" title="功能菜单">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <section id="feature-menu" class="feature-menu" aria-label="功能菜单" hidden>
      <button id="experience-toggle" class="feature-entry" type="button" aria-expanded="false" aria-controls="experience-panel">
        <span>时段体验</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <div id="experience-panel" class="experience-panel" hidden>
        <div class="experience-heading"><label for="scrub">选择时刻</label><output id="experience-clock" for="scrub"></output></div>
        <input id="scrub" type="range" min="0" max="1439" step="1">
        <div class="stops" id="experience-stops"></div>
        <button id="return-live" class="return-live" type="button" hidden>回到实况</button>
      </div>
      <button id="camera-toggle" class="feature-entry" type="button" aria-expanded="false" aria-controls="camera-panel">
        <span>镜头选择</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <fieldset id="camera-panel" class="camera-panel" aria-label="俯视镜头" hidden>
        <label><input type="radio" name="camera-mode" value="section" checked><span>分段取景</span></label>
        <label><input type="radio" name="camera-mode" value="follow"><span>跟随车头</span></label>
        <label><input type="radio" name="camera-mode" value="free"><span>自由镜头</span></label>
        <p id="free-hint" hidden><span class="mouse-hint">按住右键拖动，也可用方向键移动</span><span class="touch-hint">拖动画面移动视野</span></p>
      </fieldset>
      <button id="install-toggle" class="feature-entry" type="button" aria-expanded="false" aria-controls="install-panel">
        <span>添加到主屏幕</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <section id="install-panel" class="install-panel" aria-label="添加到主屏幕的方法" hidden>
        <p id="install-intro"></p>
        <ol id="install-steps"></ol>
        <button id="install-app" class="install-action" type="button" hidden>添加到主屏幕</button>
        <button id="copy-app-link" class="install-action secondary" type="button" hidden>复制链接</button>
        <p id="install-status" class="install-status" role="status" aria-live="polite"></p>
        <p id="offline-status" class="install-status" role="status" aria-live="polite"></p>
      </section>
      <button id="check-update" class="feature-entry" type="button" hidden>检查更新</button>
      <button id="update-app" class="feature-entry update-app" type="button" hidden>新版已准备好 · 点此更新</button>
      <p id="update-status" class="update-status" role="status" aria-live="polite"></p>
      <div class="menu-actions" role="group" aria-label="播放与显示">
        <button id="freeze" type="button" aria-label="暂停画面" aria-pressed="false" title="暂停画面"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="freeze-icon" d="M9 5v14m6-14v14"/></svg><span id="freeze-label">暂停</span></button>
        <button id="fullscreen" type="button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg><span id="fullscreen-label">全屏</span></button>
      </div>
    </section>
    <nav class="controls" aria-label="观景控制">
      <div class="views" role="group" aria-label="镜头">
        <button id="aerial" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 16 6-9 4 5 3-3 5 7H3Z"/><circle cx="17.5" cy="5.5" r="1.5"/></svg>俯视</button>
        <button id="window" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="4"/><path d="M4 15h16m-10 0 3-5 4 5"/></svg>车窗</button>
      </div>
    </nav>
    <p id="failure" class="failure" hidden></p>
  </main>
</body>
</html>
